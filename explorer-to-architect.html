{id:'d17', code:'4.2', level:4, day:17, dow:'Tue', title:'Choosing Models: Cost, Speed, Quality and Privacy', mins:120, methods:['Lecture','Activity','Discussion'],
objectives:['Explain the trade-offs between small and large models','Estimate the running cost of an AI system','Choose between hosted, open and on-device models for a need'],
notes:`
<h3>There is no “best” model</h3>
<p>There is only the best model <em>for this job</em>. Architects weigh four things:</p>
<ul>
<li><strong>Quality</strong>: how good are its answers on <em>your</em> task (not on a leaderboard)?</li>
<li><strong>Speed</strong>: how long do users wait? A WhatsApp helper must reply in seconds.</li>
<li><strong>Cost</strong>: what does each answer cost, multiplied by every user, every day?</li>
<li><strong>Privacy and control</strong>: where does the data go, and who can see it?</li>
</ul>
<h3>Small versus large</h3>
<p>Large models are better at complex reasoning, long documents and subtle writing. Small models are faster and much cheaper, and are often good enough for simple jobs: sorting messages, extracting a date, short FAQ answers. A common design uses a small model for most requests and passes only hard ones to a large model.</p>
<h3>How AI is priced</h3>
<p>Most hosted models charge per <strong>token</strong> (Day 4), usually quoted per million tokens, with output tokens costing more than input. Grounding adds input tokens, because the retrieved chunks are sent with every question. A rough monthly cost:</p>
<p class="mono">users × questions per user per day × tokens per question × days × price per token</p>
<p>In Try it you will see how a small change, like 2,000 students instead of 200, or a large model instead of a small one, moves the bill. Prices change often and differ by provider; always check current price pages.</p>
<h3>Hosted, open or on-device?</h3>
<div class="tbl-wrap"><table class="mini stackable"><thead><tr><th>Option</th><th>Strength</th><th>Watch out for</th></tr></thead><tbody>
<tr><td data-label="Option"><b>Hosted</b> (use a provider’s model through their service)</td><td data-label="Strength">Strongest models, nothing to run yourself</td><td data-label="Watch">Data leaves your organisation; price and behaviour can change</td></tr>
<tr><td data-label="Option"><b>Open-weight</b> (run a published model on your own servers)</td><td data-label="Strength">Data stays with you; full control</td><td data-label="Watch">You need skills and hardware to run and secure it</td></tr>
<tr><td data-label="Option"><b>On-device</b> (small model on the phone)</td><td data-label="Strength">Works offline; private; no per-use cost</td><td data-label="Watch">Smaller, less capable models</td></tr>
</tbody></table></div>
<p>Example 20 (crop disease for 50 villages) points to on-device: weak signal, low-cost phones, no budget for per-use fees. Example 15 (campus help desk) suits a hosted model with a contract that protects student data.</p>
<h3>Don’t forget the hidden costs</h3>
<p>People to update documents, review hand-overs and monitor quality usually cost more than the model.</p>`,
terms:[['Trade-off','Gaining one thing by giving up another, such as speed for quality.'],['Hosted model','A model you use through a provider’s service.'],['Open-weight model','A model whose internal settings are published so you can run it yourself.'],['On-device model','A small model that runs on the phone or laptop itself.'],['Routing','Sending easy requests to a small model and hard ones to a large one.']],
takeaways:['Choose the model for the job: quality, speed, cost, privacy.','Cost scales with users, questions and tokens; estimate before you launch.','Hosted, open and on-device each fit different needs.'],

{id:'d18', code:'4.3', level:4, day:18, dow:'Wed', title:'Proving It Works: Evaluation and Monitoring', mins:120, methods:['Lecture','Activity','Practice'],
objectives:['Build a test set from real questions','Grade answers against a clear standard and calculate accuracy','Set a launch threshold and a monitoring plan'],
notes:`
<h3>“It seemed fine when I tried it” is not evidence</h3>
<p>A Builder tries a tool a few times. An Architect proves it works, with numbers, before thousands of people rely on it, and keeps proving it afterwards.</p>
<h3>Step 1: build a test set</h3>
<p>A <strong>test set</strong> is a list of real questions with the correct answer for each, agreed by someone who knows. For the campus help desk (Example 15): collect 100 questions students actually asked the office last semester. Include:</p>
<ul>
<li><strong>Common questions</strong> (most of the set).</li>
<li><strong>Tricky ones</strong>: vague wording, spelling mistakes, Hinglish, two questions in one.</li>
<li><strong>Out-of-scope ones</strong> the bot should hand over, not answer.</li>
</ul>
<h3>Step 2: grade against a standard</h3>
<p>Decide what “correct” means before you look at the answers. For the help desk: the fact is right, it names the handbook section, and it hands over when the answer is not in the handbook. Two graders who disagree often reveal an unclear standard.</p>
<h3>Step 3: set a launch threshold</h3>
<p>How good is good enough depends on the cost of being wrong. A library-hours bot at 92% might be fine with a “check the notice board” line. A scholarship-eligibility bot might need 99%, or a human checking every answer. Decide the threshold <em>before</em> you see the results, so you are not tempted to move it.</p>
<h3>Step 4: monitor after launch</h3>
<ul>
<li>Re-run the test set whenever documents, instructions or the model change.</li>
<li>Track hand-over rate, thumbs-down feedback and the questions it could not answer.</li>
<li>Read a sample of real conversations each week (with privacy protections).</li>
<li>Watch for <strong>drift</strong>: new rules, new courses, a new semester.</li>
</ul>
<h3>Measuring value, not just accuracy</h3>
<p>Accuracy says whether it answers well. Value says whether it helps: fewer queues at the office, food waste down from 40 kg to 25 kg a week (Example 6), more students revising earlier (Example 1). Set a baseline before launch, or you can never prove the difference.</p>`,
terms:[['Test set','Real questions with agreed correct answers, used to measure quality.'],['Accuracy','The share of test questions answered correctly.'],['Launch threshold','The minimum score required before release, set in advance.'],['Monitoring','Ongoing checks after launch.'],['Baseline','The measurement before the change, used to prove value.']],
takeaways:['Prove it with a test set, not a few tries.','Set the standard and the threshold before you look at results.','Keep monitoring; set a baseline to prove value.'],
hw:'Write ten test questions for your capstone idea: six common, three tricky, one out of scope, each with its correct answer or correct behaviour.',
inst:{purpose:'Give trainees the evaluation habit that separates hobby tools from systems people can rely on.',
flow:[['0–10','Homework share: cost estimates. Who changed their model choice?'],['10–25','Why “it seemed fine” is not evidence. The four steps.'],['25–50','Try it: Grade the help desk. Trainees grade individually, then compare with a partner. Discuss disagreements: they reveal unclear standards.'],['50–60','Break.'],['60–75','Launch thresholds by cost of being wrong. Use the threshold slider.'],['75–95','Practice: teams write ten test questions for their capstone.'],['95–105','Read Examples 1, 6, 10 and 11 at Architect level.'],['105–115','Check (5 questions).'],['115–120','Homework.']],
say:['“If you didn’t measure it, you don’t know it.”','“Decide the bar before you jump.”'],
ask:['What score would you need before letting a bot answer scholarship questions?','How would you know if it got worse next semester?'],
watch:['Test sets made only of easy questions.','Moving the threshold after seeing results.','Measuring accuracy but never value.'],
tips:['Grading disagreement is the best teaching moment; don’t rush it.','Teams will reuse their test questions in the capstone.'],
materials:['Grading activity in Try it','Flip chart for threshold discussion']},

quiz:[

{id:'d19', code:'4.4', level:4, day:19, dow:'Thu', title:'Governance: Responsible AI by Design', mins:120, methods:['Lecture','Activity','Discussion'],
objectives:['Identify risks and rate them by likelihood and impact','Choose controls: rules, human oversight, transparency and data protection','Write the governance plan for an AI system: owners, policies, incident response'],
notes:`
<h3>Governance is how you stay in control</h3>
<p><strong>AI governance</strong> is the set of decisions, people and processes that keep an AI system safe, fair, legal and trustworthy over its whole life. It answers: <em>who decides, who is accountable, what is allowed, and what happens when something goes wrong?</em> Architects design governance in from the start, not after a problem makes the news.</p>
<h3>Step 1: find the risks</h3>
<p>For each system, ask what could go wrong for each group of people affected:</p>
<ul>
<li><strong>Wrong answers</strong>: hallucinations, outdated documents.</li>
<li><strong>Unfairness</strong>: works worse for some languages, accents or groups (Example 19).</li>
<li><strong>Privacy</strong>: personal or health data stored, leaked or misused (Example 9).</li>
<li><strong>Harmful actions</strong>: an agent pays, sends or deletes wrongly (Example 8).</li>
<li><strong>Misuse</strong>: people using it to cheat, harass or deceive (Example 7: fake images of real people).</li>
<li><strong>Over-reliance</strong>: people stop checking because it is usually right.</li>
</ul>
<h3>Step 2: rate them</h3>
<p>Rate each risk by <strong>likelihood</strong> (how often) and <strong>impact</strong> (how bad). High-likelihood, high-impact risks must be controlled before launch. Low and low may just need monitoring. You will do this in Try it with the campus wellness assistant.</p>
<h3>Step 3: choose controls</h3>
<ul>
<li><strong>Design it out</strong>: don’t let the wellness bot give diagnoses at all; route to the counsellor.</li>
<li><strong>Human oversight</strong>: approvals, hand-overs, review of samples.</li>
<li><strong>Transparency</strong>: tell users they are talking to AI, what it can’t do, and how to reach a person.</li>
<li><strong>Data protection</strong>: collect the minimum, keep it for the shortest time, restrict access (Example 19: delete recordings after 7 days).</li>
<li><strong>Fairness checks</strong>: test results across groups, not just on average (Example 4).</li>
</ul>
<h3>Step 4: the governance plan</h3>
<ul>
<li><strong>Accountable owner</strong>: one named person, not “the team”.</li>
<li><strong>Acceptable-use policy</strong>: what users may and may not use it for.</li>
<li><strong>Incident response</strong>: how users report problems, who investigates, how fast, and when you switch it off.</li>
<li><strong>Review cycle</strong>: re-check risks every semester or when anything changes.</li>
</ul>
<h3>Laws and frameworks</h3>
<p>India’s Digital Personal Data Protection Act, 2023 sets duties for anyone handling personal data, including consent and purpose limits. The EU AI Act classifies AI uses by risk, with stricter rules for areas like education and hiring. Frameworks such as the NIST AI Risk Management Framework and ISO/IEC 42001 offer structured approaches. You don’t need to be a lawyer; you need to know when to involve one.</p>
<h3>AI and jobs</h3>
<p>Responsible design also asks what happens to people’s work. The best systems remove drudgery and keep people in the decisions that need judgement and care.</p>`,
terms:[['AI governance','The decisions, people and processes that keep AI safe, fair, legal and trustworthy.'],['Likelihood × impact','A way to rank risks by how often and how badly they could happen.'],['Control','A measure that reduces a risk.'],['Incident response','The plan for reporting, investigating and fixing AI problems.'],['Over-reliance','Trusting AI so much that people stop checking.']],
takeaways:['Governance answers: who decides, who is accountable, what is allowed, what if it goes wrong.','Rate risks by likelihood and impact; control the worst before launch.','Name an owner, write the policy, plan for incidents, review regularly.'],
hw:'Complete the risk and governance sections for your capstone: your top three risks, their ratings, controls, the accountable owner and the incident plan.',

materials:['Risk matrix in Try it','Your college’s data and IT policies']},

quiz:[
 {q:'AI governance is best described as…', o:['A government department','The decisions, people and processes that keep AI safe, fair, legal and trustworthy','A type of model','A coding language'], a:1, why:'It covers the whole life of the system.'},
 {q:'A risk with high likelihood and high impact should be…', o:['Ignored','Controlled before launch','Monitored once a year','Given to the model to decide'], a:1, why:'The worst risks need controls first.'},

/* ---------- practice quiz ---------- */
function practiceQuiz(root, qs, id){
  root.innerHTML = '';
  const wrap = el('<div class="quiz"></div>'); root.appendChild(wrap);
  let answered = 0, correct = 0;
  qs.forEach((q, qi) => {
    const card = el(`<div class="qcard"><span class="qn">Question ${qi + 1} of ${qs.length}</span><div class="qq">${esc(q.q)}</div><div class="opts">${q.o.map((o, oi) => `<button class="opt" data-i="${oi}"><span class="k">${'ABCD'[oi]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`);
    $$('.opt', card).forEach(b => b.addEventListener('click', () => {
      const pick = +b.dataset.i, ok = pick === q.a;
      $$('.opt', card).forEach(x => { x.disabled = true; const i = +x.dataset.i; if (i === q.a) x.classList.add('right'); else if (i === pick) x.classList.add('wrong'); });
      card.appendChild(el(`<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${esc(q.why)}</div>`));
      answered++; if (ok) correct++;
      if (answered === qs.length) finish();
    }));
    wrap.appendChild(card);
  });
  function finish(){
    const prev = S.scores[id];
    if (!prev || correct > prev.score) S.scores[id] = {score:correct, total:qs.length};
    store.set('scores', S.scores); renderNav(current);
    const box = el(`<div class="scorebox"><span class="big">${correct}/${qs.length}</span><div class="stack" style="gap:4px"><b>${correct === qs.length ? 'Full marks.' : correct >= Math.ceil(qs.length * .7) ? 'Good work.' : 'Worth another look at the notes.'}</b><span class="muted">Best score saved: ${S.scores[id].score}/${qs.length}</span></div><button class="btn ghost" style="margin-left:auto">Try again</button></div>`);
    $('button', box).addEventListener('click', () => practiceQuiz(root, qs, id));
    wrap.appendChild(box);
    box.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'nearest'});
  }
}

function choiceCards(body, items, choices, intro){
  if (intro) body.appendChild(el(`<p>${intro}</p>`));
  const list = el('<div class="cardlist"></div>'); body.appendChild(list);
  const score = el('<p class="muted" aria-live="polite"></p>'); body.appendChild(score);
  let done = 0, right = 0;
  items.forEach(it => {
    const c = el(`<div class="ccard"><b>${esc(it.t)}</b><div class="row chips" style="gap:6px">${choices.map((ch, i) => `<button class="chipbtn" data-i="${i}">${esc(ch)}</button>`).join('')}</div></div>`);
    $$('.chipbtn', c).forEach(b => b.addEventListener('click', () => {
      const pick = +b.dataset.i, ok = pick === it.a;
      $$('.chipbtn', c).forEach(x => { x.disabled = true; if (+x.dataset.i === it.a) x.classList.add('right'); else if (+x.dataset.i === pick) x.classList.add('wrong'); });
      c.appendChild(el(`<div class="fb ${ok ? 'ok' : 'no'}"><b>${ok ? 'Yes.' : esc(choices[it.a]) + '.'}</b> ${esc(it.why)}</div>`));
      done++; if (ok) right++;
      score.textContent = `${right} of ${done} right so far` + (done === items.length ? ' · all done' : '');
    }));
    list.appendChild(c);
  });
  const again = el('<div><button class="btn ghost">Reset</button></div>');
  $('button', again).addEventListener('click', () => { list.remove(); score.remove(); again.remove(); choiceCards(body, items, choices, null); });
  body.appendChild(again);
}
function copyText(node, msg){
  const txt = node.value != null && node.tagName === 'TEXTAREA' ? node.value : node.textContent;
  const fallback = () => { try { const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch(e){} msg.textContent = 'Selected. Press Ctrl+C or Cmd+C (or long-press and Copy on a phone).'; };
  try { navigator.clipboard.writeText(txt).then(() => msg.textContent = 'Copied.', fallback); } catch(e){ fallback(); }
}

ACT.trainfilter = body => {
  const TRAIN = [
    ['Congratulations! You won ₹50,000 cash prize, click link to claim now',1],['Reminder: Economics tutorial moved to Room 204 tomorrow',0],
    ['Earn ₹5,000 daily from home, no experience needed, click now',1],['Can you share the notes from today’s lecture?',0],
    ['Your KYC is blocked, click link to update urgently',1],['Fest volunteers meeting at 5 pm in the amphitheatre',0],
    ['Free recharge offer, claim your prize before midnight',1],['Library will close early tomorrow for maintenance',0],
    ['Urgent: claim your free laptop scholarship, pay ₹99 now',1],['Group project meeting moved to Friday after class',0]
  ];
  const TEST = [
    ['Claim your free prize now, click the link',1],['Tutorial notes uploaded, check before the meeting',0],['Urgent KYC update needed, click now',1],
    ['Room changed for tomorrow’s lecture',0],['Win cash daily, no experience needed',1],['Can we meet at the library after class?',0]
  ];
  const lab = TRAIN.map(() => -1);
  body.appendChild(el('<p>You are the teacher. Label each training message as <b>Spam</b> or <b>Not spam</b>. The machine learns which words go with which label, then tries six messages it has never seen. Afterwards, try labelling a few wrongly on purpose and train again.</p>'));
  const list = el(`<div class="cardlist">${TRAIN.map((t, i) => `<div class="ccard"><span>${esc(t[0])}</span><div class="row" style="gap:6px"><button class="chipbtn" data-i="${i}" data-v="1" aria-pressed="false">Spam</button><button class="chipbtn" data-i="${i}" data-v="0" aria-pressed="false">Not spam</button></div></div>`).join('')}</div>`);
  body.appendChild(list);
  const ctl = el('<div class="row"><button class="btn acc" id="tfGo" disabled>Train the machine</button><button class="btn ghost" id="tfAuto">Label all correctly for me</button><span class="muted" id="tfN" aria-live="polite">0 of 10 labelled</span></div>');
  body.appendChild(ctl);
  const res = el('<div class="stack"></div>'); body.appendChild(res);
  const sync = () => {
    $$('.chipbtn', list).forEach(b => b.setAttribute('aria-pressed', lab[+b.dataset.i] === +b.dataset.v));
    const n = lab.filter(x => x >= 0).length;
    $('#tfN', ctl).textContent = n + ' of 10 labelled' + (n < 6 ? ' (label at least 6 to train)' : '');
    $('#tfGo', ctl).disabled = n < 6;
  };
  $$('.chipbtn', list).forEach(b => b.addEventListener('click', () => { lab[+b.dataset.i] = +b.dataset.v; sync(); }));
  $('#tfAuto', ctl).addEventListener('click', () => { TRAIN.forEach((t, i) => lab[i] = t[1]); sync(); });
  $('#tfGo', ctl).addEventListener('click', () => {
    const cnt = [{}, {}], tot = [0, 0], docs = [0, 0];
    TRAIN.forEach((t, i) => { if (lab[i] < 0) return; const c = lab[i]; docs[c]++; toks(t[0]).forEach(w => { cnt[c][w] = (cnt[c][w] || 0) + 1; tot[c]++; }); });
    const vocab = new Set([...Object.keys(cnt[0]), ...Object.keys(cnt[1])]).size || 1;
    const wscore = w => Math.log(((cnt[1][w] || 0) + 1) / (tot[1] + vocab)) - Math.log(((cnt[0][w] || 0) + 1) / (tot[0] + vocab));
    let right = 0;
    const rows = TEST.map(t => {
      const ws = toks(t[0]); let s = Math.log((docs[1] + 1) / (docs[0] + 1));
      const sc = ws.map(w => [w, wscore(w)]); sc.forEach(x => s += x[1]);
      const pred = s > 0 ? 1 : 0, ok = pred === t[1]; if (ok) right++;
      const clues = sc.filter(x => Math.abs(x[1]) > 0.25).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 3).map(x => `<span class="pill ${x[1] > 0 ? 'no' : 'ok'}">${esc(x[0])}</span>`).join(' ');
      return `<tr><td data-label="Message">${esc(t[0])}</td><td data-label="Machine says"><span class="pill ${ok ? 'ok' : 'no'}">${pred ? 'Spam' : 'Not spam'}</span></td><td data-label="Clue words">${clues || '<span class="muted">none</span>'}</td></tr>`;
    }).join('');
    const wrongLabels = TRAIN.filter((t, i) => lab[i] >= 0 && lab[i] !== t[1]).length;
    res.innerHTML = `<div class="row"><span class="stat" style="flex-direction:row;gap:10px;align-items:baseline"><span class="v">${right}/6</span><span class="l">new messages right</span></span><span class="muted" style="flex:1;min-width:200px">${wrongLabels ? `You gave ${wrongLabels} wrong label${wrongLabels > 1 ? 's' : ''}. The machine learned your mistakes faithfully. Garbage in, garbage out.` : right === 6 ? 'It learned the pattern from your examples, without a single rule written by you.' : 'Label more messages and train again; more good examples usually help.'}</span></div>
    <div class="tbl-wrap"><table class="mini stackable"><thead><tr><th>New message</th><th>Machine says</th><th>Clue words it learned</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted">Red clue words pushed towards spam; green towards not spam.</p>`;
  });
  sync();
};

ACT.layers = body => {
  const G = 10, spots = new Set([23,24,33,34,46,56,57,65,66]);
  const leaf = new Set(); for (let r = 0; r < G; r++) for (let c = 0; c < G; c++){ const dx = (c - 4.5) / 4.3, dy = (r - 4.5) / 3.6; if (dx * dx + dy * dy < 1) leaf.add(r * G + c); }
  const edge = new Set([...leaf].filter(i => { const r = Math.floor(i / G), c = i % G; return [[0,1],[1,0],[0,-1],[-1,0]].some(([a, b]) => r + a < 0 || r + a >= G || c + b < 0 || c + b >= G || !leaf.has((r + a) * G + c + b)); }));
  const STAGES = [
    {t:'Input: the photo', d:'To the computer the photo is just a grid of coloured squares (here 10 × 10; a real photo has millions). There is no square labelled “disease”.', hl:null},
    {t:'Layer 1: colours and edges', d:'The first layer reacts to simple things: where green meets background (edges) and where colour suddenly changes. Highlighted: the edges it found.', hl:edge},
    {t:'Layer 2: spots and shapes', d:'The next layer combines edges and colours into patterns: round brown patches inside green. Highlighted: the patches it found.', hl:spots},
    {t:'Layer 3: whole things', d:'The last layer combines patterns into a judgement about the whole leaf, with a confidence for each possibility.', hl:'out'}
  ];
  let k = 0;
  body.appendChild(el('<p>Step through how a deep network might judge a photo of a leaf (Example 20). Nobody told the layers what to look for; they learned it from thousands of labelled photos.</p>'));
  const ui = el(`<div class="pix-layout"><div class="pgrid" style="grid-template-columns:repeat(${G},1fr)" aria-hidden="true">${Array.from({length:G * G}, (_, i) => `<div data-i="${i}"></div>`).join('')}</div><div class="stack"><span class="eyebrow" id="lyN"></span><h4 id="lyT"></h4><p id="lyD"></p><div class="bars" id="lyOut" hidden>
    <div class="bar"><span>Rust disease</span><span class="tr"><i style="width:84%"></i></span><span class="pct">84%</span></div>
    <div class="bar"><span>Healthy</span><span class="tr"><i class="w" style="width:9%"></i></span><span class="pct">9%</span></div>
    <div class="bar"><span>Leaf blight</span><span class="tr"><i class="w" style="width:7%"></i></span><span class="pct">7%</span></div></div>
    <div class="row"><button class="btn ghost" id="lyB">Back</button><button class="btn acc" id="lyF">Next layer</button></div><p class="muted" id="lyNote" hidden>84% sure is not 100% sure. A good app says “likely rust disease” and suggests confirming with an expert, as Gurpreet does.</p></div></div>`);
  body.appendChild(ui);
  const cells = $$('.pgrid div', ui);
  function draw(){
    const s = STAGES[k];
    cells.forEach((c, i) => {
      let bg = leaf.has(i) ? (spots.has(i) ? '#8A5A2B' : '#4E9A4A') : 'var(--surface-2)';
      let op = 1;
      if (s.hl && s.hl !== 'out') op = s.hl.has(i) ? 1 : .18;
      c.style.background = bg; c.style.opacity = op;
      c.style.outline = (s.hl && s.hl !== 'out' && s.hl.has(i)) ? '2px solid var(--warm)' : 'none';
    });
    $('#lyN', ui).textContent = 'Stage ' + (k + 1) + ' of 4'; $('#lyT', ui).textContent = s.t; $('#lyD', ui).textContent = s.d;
    $('#lyOut', ui).hidden = s.hl !== 'out'; $('#lyNote', ui).hidden = s.hl !== 'out';
    $('#lyB', ui).disabled = k === 0; $('#lyF', ui).disabled = k === 3;
  }
  $('#lyB', ui).addEventListener('click', () => { if (k > 0){ k--; draw(); } });
  $('#lyF', ui).addEventListener('click', () => { if (k < 3){ k++; draw(); } });
  draw();
};

ACT.nextword = body => {
  const A = [['delicious',.34],['cold',.2],['amazing',.14],['spicy',.12],['legendary',.07],['suspicious',.06],['philosophical',.04],['purple',.03]];
  const B = [['as usual.',.42],['for once.',.2],['again.',.16],['beyond belief.',.1],['like a poem.',.07],['according to the moon.',.05]];
  body.appendChild(el('<p>The model is finishing the sentence <b>“The canteen samosa today is …”</b>. It picks one word, then the next, each time from a list of probabilities. Change the temperature and generate several times.</p>'));
  const ui = el(`<div class="stack">
    <div class="ctrl"><label for="nwT">Temperature <b id="nwTv"></b></label><input type="range" id="nwT" min="0.1" max="2" step="0.1" value="0.3"></div>
    <div class="bars" id="nwBars"></div>
    <div class="row"><button class="btn acc" id="nwGo">Generate</button><button class="btn ghost" id="nwTen">Generate 5 more</button><button class="btn ghost" id="nwClr">Clear</button></div>
    <div class="stack" id="nwOut" style="gap:8px"></div>
    <div class="row"><span class="stat" style="flex-direction:row;gap:10px;align-items:baseline"><span class="v" id="nwDist">0</span><span class="l">different sentences out of <b id="nwTot">0</b></span></span></div></div>`);
  body.appendChild(ui);
  const outs = [];
  const temp = () => +$('#nwT', ui).value;
  const adj = arr => { const T = temp(); const w = arr.map(x => Math.pow(x[1], 1 / T)); const s = w.reduce((a, b) => a + b, 0); return arr.map((x, i) => [x[0], w[i] / s]); };
  const pick = arr => { const p = adj(arr); let r = Math.random(); for (const x of p){ r -= x[1]; if (r <= 0) return x[0]; } return p[p.length - 1][0]; };
  function bars(){
    $('#nwTv', ui).textContent = temp().toFixed(1) + (temp() < .5 ? ' · steady' : temp() > 1.2 ? ' · adventurous' : ' · balanced');
    $('#nwBars', ui).innerHTML = '<span class="eyebrow">Chance of each next word</span>' + adj(A).map(x => `<div class="bar"><span>${esc(x[0])}</span><span class="tr"><i style="width:${(100 * x[1]).toFixed(1)}%"></i></span><span class="pct">${Math.round(100 * x[1])}%</span></div>`).join('');
  }
  function gen(){ outs.unshift('The canteen samosa today is ' + pick(A) + ' ' + pick(B)); if (outs.length > 12) outs.pop(); show(); }
  function show(){
    $('#nwOut', ui).innerHTML = outs.map((o, i) => `<div class="gen-out" style="font-size:${i ? 16 : 20}px;opacity:${i ? .75 : 1}">${esc(o)}</div>`).join('');
    $('#nwDist', ui).textContent = new Set(outs).size; $('#nwTot', ui).textContent = outs.length;
  }
  $('#nwT', ui).addEventListener('input', bars);
  $('#nwGo', ui).addEventListener('click', gen);
  $('#nwTen', ui).addEventListener('click', () => { for (let i = 0; i < 5; i++) gen(); });
  $('#nwClr', ui).addEventListener('click', () => { outs.length = 0; show(); });
  bars(); show();
  body.appendChild(el('<p class="muted">Low temperature repeats the safest words. High temperature is creative and occasionally absurd (“purple … according to the moon”). Either way, the model is choosing likely words, not checking facts.</p>'));
};

function rubricSelf(body, P, pre, saved){
  const box = el(`<div class="stack"><h4>Self-check against the rubric</h4><div class="tbl-wrap"><table class="mini stackable"><thead><tr><th>Criterion</th><th>Your level</th></tr></thead><tbody>${P.crit.map((c, i) => `<tr><td data-label="Criterion"><b>${esc(c[0])}</b></td><td data-label="Your level"><select id="${pre}${i}" style="width:100%"><option value="">Choose…</option>${[1, 2, 3].map(j => `<option value="${j - 1}">${j - 1} · ${esc(c[j])}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="row"><span class="stat" style="flex-direction:row;gap:10px;align-items:baseline"><span class="v" id="${pre}T">0/${P.max}</span><span class="l" id="${pre}L"></span></span></div></div>`);
  body.appendChild(box);
  const sels = P.crit.map((_, i) => $('#' + pre + i, box));
  sels.forEach((s, i) => { if (saved[i] != null && saved[i] !== '') s.value = saved[i]; });
  const total = () => sels.reduce((a, s) => a + (s.value === '' ? 0 : +s.value), 0);
  const upd = () => { const all = sels.every(s => s.value !== ''); $('#' + pre + 'T', box).textContent = total() + '/' + P.max; $('#' + pre + 'L', box).textContent = !all ? 'score every criterion' : total() >= P.pass ? 'pass level (' + P.pass + ' needed)' : 'below pass (' + P.pass + ' needed)'; };
  let cb = null; sels.forEach(s => s.addEventListener('change', () => { upd(); if (cb) cb(); }));
  upd();
  return {get:() => sels.map(s => s.value), total, onChange:f => cb = f};
}

ACT.agent = body => {
  const LV = ['1 · Suggest','2 · Draft for approval','3 · Act with oversight','4 · Fully autonomous'];
  body.appendChild(el('<p><b>Goal:</b> “Book Seminar Room 2 for Friday 4–6 pm and invite the Photography Club’s 30 members to the workshop.” Choose an autonomy level, then step through the agent’s run. Try level 2, then level 4.</p>'));
  const ui = el(`<div class="stack"><div class="field"><label for="agL">Autonomy level</label><select id="agL">${LV.map((l, i) => `<option value="${i}"${i === 1 ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="agent-log" id="agLog"></div><div class="row" id="agCtl"></div></div>`);
  body.appendChild(ui);
  let lv = 1, k = 0, fixed = false, log = [];
  const STEPS = [
    {kind:'think', t:'Plan', d:'Break the goal into steps: check the room, book it, get the member list, draft the invite, send it.'},
    {kind:'read', t:'Use tool', tool:'rooms.check(“Seminar Room 2”, Fri 16:00–18:00)', d:'Result: the room is free.'},
    {kind:'act', t:'Action', tool:'rooms.book(“Seminar Room 2”, Fri 16:00–18:00)', d:'Booking the room (can be cancelled until Thursday).'},
    {kind:'read', t:'Use tool', tool:'contacts.get(“Photography Club”)', d:'Result: 30 members, plus the “Photography alumni” mailing list (412 people) that shares the same tag.'},
    {kind:'draft', t:'Draft', tool:'email.draft(...)', d:'Drafted invite: “Photography workshop, Fri 4–6 pm, Seminar Room 2. Bring your phone or camera!”'},
    {kind:'send', t:'Action', tool:'email.send(to: recipients)', d:''}
  ];
  const recip = () => fixed ? 30 : 442;
  function add(html){ log.push(html); }
  function render(waiting){
    $('#agLog', ui).innerHTML = log.join('') || '<p class="muted">Press “Next step” to start the agent.</p>';
    const c = $('#agCtl', ui); c.innerHTML = '';
    if (waiting){
      const a = el('<button class="btn acc">Approve</button>'), r = el('<button class="btn ghost">Reject and correct</button>');
      a.addEventListener('click', () => { add(`<div class="astep"><span class="k">You</span><b>Approved.</b></div>`); exec(waiting, true); });
      r.addEventListener('click', () => { if (waiting.kind === 'send' && !fixed){ fixed = true; add(`<div class="astep"><span class="k">You</span><b>Rejected: “Only the 30 current members, not alumni.”</b><span class="muted">The agent removes the alumni list and asks again.</span></div>`); askApproval(waiting); } else { add(`<div class="astep"><span class="k">You</span><b>Rejected.</b><span class="muted">The agent stops this step and waits for new instructions.</span></div>`); k = STEPS.length; finish(); } });
      c.appendChild(a); c.appendChild(r);
    } else if (k < STEPS.length){
      const n = el('<button class="btn acc">Next step</button>'); n.addEventListener('click', step); c.appendChild(n);
    }
    const rs = el('<button class="btn ghost">Restart</button>'); rs.addEventListener('click', reset); c.appendChild(rs);
  }
  function askApproval(s){
    const det = s.kind === 'send' ? `Send invite to <b>${recip()} people</b>${recip() > 30 ? ' (includes 412 alumni)' : ''}.` : esc(s.d);
    add(`<div class="astep" style="border-color:var(--warm)"><span class="k" style="color:var(--warm)">Waiting for your approval</span><span class="tool">${esc(s.tool)}</span><span>${det}</span></div>`);
    render(s);
  }
  function exec(s, approved){
    if (s.kind === 'send') add(`<div class="astep"><span class="k">Action done</span><span class="tool">${esc(s.tool)}</span><span>Invite sent to <b>${recip()} people</b>.${recip() > 30 ? ' <span class="pill no">412 alumni were invited by mistake</span>' : ' <span class="pill ok">correct recipients</span>'}</span>${lv === 2 ? '<span class="muted">Logged for your later review.</span>' : ''}</div>`);
    else add(`<div class="astep"><span class="k">Action done</span><span class="tool">${esc(s.tool)}</span><span>${esc(s.d)}</span>${lv === 2 ? '<span class="muted">Logged for your later review.</span>' : ''}</div>`);
    k++; if (k >= STEPS.length) finish(); else render(null);
  }
  function step(){
    const s = STEPS[k];
    if (s.kind === 'think' || s.kind === 'read' || s.kind === 'draft'){ add(`<div class="astep"><span class="k">${esc(s.t)}</span>${s.tool ? `<span class="tool">${esc(s.tool)}</span>` : ''}<span>${esc(s.d)}</span></div>`); k++; if (k >= STEPS.length) finish(); else render(null); return; }
    if (lv === 0){ add(`<div class="astep"><span class="k">Suggestion</span><span>I suggest you ${s.kind === 'send' ? 'send the invite to the members list (check: it currently includes 412 alumni)' : 'book Seminar Room 2 for Friday 4–6 pm'}. I will not do it myself.</span></div>`); k++; if (k >= STEPS.length) finish(); else render(null); return; }
    if (lv === 1){ askApproval(s); return; }
    exec(s, false);
  }
  function finish(){
    const outcome = lv === 0 ? 'You did every action yourself. Safe, but slow for routine tasks.' : lv === 1 ? (fixed ? 'Because you approved each action, you caught the alumni mistake before anything was sent.' : 'You approved the send without reading the recipient count, so 412 alumni got the invite. Approval only works if you actually check.') : 'The agent acted without stopping. One wrong result from a tool (the alumni list) went straight out to 442 people. ' + (lv === 2 ? 'You can see it in the log, but only after it happened.' : 'With no log review, you might not even notice.');
    add(`<div class="astep" style="border-color:var(--accent)"><span class="k">Run finished</span><span>${outcome}</span></div>`);
    render(null);
  }
  function reset(){ k = 0; fixed = false; log = []; render(null); }
  $('#agL', ui).addEventListener('change', e => { lv = +e.target.value; reset(); });
  render(null);
};

    if (Date.now() >= run.deadline) finish(run, run.ans, true);

  } else intro();
}

function badgeStatus(n){
  const mods = MODULES.filter(m => m.level === n);
  const checks = mods.filter(m => S.scores[m.id]).length;
  const t = S.tests['t' + n];
  const prac = store.get('prac', {})[n];
  const P = n === 4 ? {max:20, pass:12, name:'Capstone blueprint'} : PRACTICALS[n];
  const pv = prac === '' || prac == null ? NaN : +prac;
  const req = [
    [checks === mods.length, `Daily checks attempted: ${checks} of ${mods.length}`],
    [!!(t && t.best >= 70), `${TEST_NAMES['t' + n]} 70% or higher${t ? ' (best ' + t.best + '%)' : ''}`],
    [Number.isInteger(pv) && pv >= P.pass && pv <= P.max, `${P.name} ${P.pass}/${P.max} or higher${Number.isInteger(pv) ? ' (entered ' + pv + ')' : ''}`]
  ];
  return {ok:req.every(r => r[0]), req, t, pv, P};
}

const certId = (pfx, name, a, b, date) => pfx + '-' + date.replace(/-/g, '').slice(2) + '-' + Math.abs([...name + a + b].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7)).toString(36).toUpperCase().slice(0, 6);
const LCOL = ['#22577F','#0C6573','#B8741A','#5B3B8C'];
function fitText(c, text, maxW, weight, start, min, family){
  let fs = start; const set = f => c.font = `${weight} ${f}px ${family}`; set(fs);
  while (c.measureText(text).width > maxW && fs > min){ fs -= 2; set(fs); }
  return fs;
}
function drawBadge(out, name, n, pct, prac, max, date, preview){

function drawCert(out, name, pct, cap, date, preview){
  const dist = pct >= 90 && cap >= 17;

    const W = 1600, H = 1130, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
    const ink = '#15262B', acc = '#0C6573', warm = '#B8741A', paper = '#FBFCFA', mute = '#56696D';
    c.fillStyle = paper; c.fillRect(0, 0, W, H);
    c.strokeStyle = acc; c.lineWidth = 6; c.strokeRect(40, 40, W - 80, H - 80); c.lineWidth = 1.5; c.strokeRect(60, 60, W - 120, H - 120);
    for (let i = 0; i < 4; i++){ const h = 28 + i * 22; c.fillStyle = LCOL[i]; c.fillRect(W / 2 - 2 * 44 + i * 44, 195 - h, 32, h); }
    c.textAlign = 'center'; c.fillStyle = mute; c.font = '600 22px "JetBrains Mono", monospace'; c.fillText('EXPLORER TO ARCHITECT · AI FOR EVERY STUDENT', W / 2, 250);
    c.fillStyle = ink; c.font = '800 76px "Bricolage Grotesque", sans-serif'; c.fillText(preview ? 'Certificate (preview)' : 'Certificate of Achievement', W / 2, 345);
    c.fillStyle = mute; c.font = '28px "Atkinson Hyperlegible", sans-serif'; c.fillText('This certifies that', W / 2, 425);
    c.fillStyle = ink; let ulY = 560; const maxW = W - 300, setF = f => c.font = `700 ${f}px "Bricolage Grotesque", sans-serif`;
    let fs = 84; setF(fs); while (c.measureText(name).width > maxW && fs > 52){ fs -= 4; setF(fs); }
    if (c.measureText(name).width <= maxW) c.fillText(name, W / 2, 525);
    else {
      const words = name.split(/\s+/); let best = [name, ''], bd = Infinity;
      for (let i = 1; i < words.length; i++){ const l1 = words.slice(0, i).join(' '), l2 = words.slice(i).join(' '); const d = Math.abs(c.measureText(l1).width - c.measureText(l2).width); if (d < bd){ bd = d; best = [l1, l2]; } }
      fs = 56; setF(fs); while (Math.max(c.measureText(best[0]).width, c.measureText(best[1]).width) > maxW && fs > 24){ fs -= 2; setF(fs); }
      c.fillText(best[0], W / 2, 490); if (best[1]) c.fillText(best[1], W / 2, 490 + Math.round(fs * 1.05)); ulY = 490 + Math.round(fs * 1.05) + 26;
    }
    c.strokeStyle = warm; c.lineWidth = 3; c.beginPath(); c.moveTo(W / 2 - 360, ulY); c.lineTo(W / 2 + 360, ulY); c.stroke();
    c.fillStyle = ink; c.font = '29px "Atkinson Hyperlegible", sans-serif';
    c.fillText('has completed the 4-week Explorer to Architect programme, earned the Explorer,', W / 2, 640);
    c.fillText('Consumer, Builder and Architect badges, and met the requirements for', W / 2, 683);
    c.fillStyle = dist ? warm : acc; c.font = '800 48px "Bricolage Grotesque", sans-serif'; c.fillText(dist ? 'Certified AI Architect with Distinction' : 'Certified AI Architect', W / 2, 765);
    c.fillStyle = mute; c.font = '22px "JetBrains Mono", monospace'; c.fillText('Mindset Shift · Mastering the Interface · Connecting the Bricks · System Design & Governance', W / 2, 815, W - 200);
    c.fillText(`Final assessment ${pct}%  ·  Capstone ${cap}/20  ·  ${date}`, W / 2, 855);
    c.strokeStyle = ink; c.lineWidth = 1.5; [[360, 'Lead instructor'], [W - 360, 'Programme owner']].forEach(([x, l]) => { c.beginPath(); c.moveTo(x - 190, 965); c.lineTo(x + 190, 965); c.stroke(); c.fillStyle = mute; c.font = '22px "Atkinson Hyperlegible", sans-serif'; c.fillText(l, x, 1000); });
    c.fillStyle = mute; c.font = '20px "JetBrains Mono", monospace'; c.fillText('ID ' + id + ' · valid 24 months', W / 2, 1000);
    if (preview){ c.save(); c.translate(W / 2, H / 2); c.rotate(-.35); c.fillStyle = 'rgba(176,56,56,.14)'; c.font = '800 220px "Bricolage Grotesque", sans-serif'; c.fillText('SAMPLE', 0, 60); c.restore(); }
    out.innerHTML = '';
    const img = new Image(); img.className = 'cert-img'; img.alt = 'Certificate for ' + name; img.src = cv.toDataURL('image/png');
    out.appendChild(img);
    out.appendChild(el(`<p class="muted">To save it, long-press it (phone) or right-click it and choose “Save image as” (laptop). Give the ID <span class="mono">${esc(id)}</span> to your instructor so it can be logged.</p>`));
  };
  try { document.fonts.ready.then(go, go); } catch(e){ go(); }
}
